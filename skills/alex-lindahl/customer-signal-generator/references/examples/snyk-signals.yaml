meta:
  seller_company: Snyk
  seller_domain: snyk.io
  seller_perspective: Snyk sellers prospecting new buyers
  focus_segment: null
  run_mode: full
  run_date: '2026-10-07'
  backtest_date: null
  clay_mode: public
  icp:
    industries:
    - Software Development
    - Financial Services
    - Technology, Information and Internet
    - Banking
    - Insurance
    employee_range:
    - 200
    - 10000
    regions:
    - North America
    - Europe
    must_have:
    - Ships its own software
    - Engineering team of 50+ contributing developers
signals:
- id: eng_headcount_growth
  name: Headcount growth of 15%+ over 12 months
  category: demographic_firmographic
  trigger_ref: T7
  buying_stage: awareness
  decay_window_days: 120
  weight: 10
  source: clay
  clay_source:
    type: search_filter
    name: employee_growth_12mo
    custom_prompt: null
  threshold: employee_growth_12mo >= 1.15 and 200-10,000 employees
  external_source: null
  backtest:
    verdict: not_backtested
  personas:
  - VP Engineering
  - Head of Platform Engineering
  play_ref: null
- id: growth_funding
  name: Series B or later round of $30M+ in the last 90 days
  category: demographic_firmographic
  trigger_ref: T7
  buying_stage: awareness
  decay_window_days: 90
  weight: 15
  source: inferred
  clay_source:
    type: company_data_point
    name: Latest Funding
    custom_prompt: null
  threshold: Latest round >= $30M, Series B or later, closed within 90 days
  external_source: null
  backtest:
    verdict: not_backtested
  personas:
  - VP Engineering
  - CTO
  play_ref: play_growth
- id: eu_market_entry
  name: Opening an EU entity, office or product line
  category: demographic_firmographic
  trigger_ref: T4
  buying_stage: awareness
  decay_window_days: 120
  weight: 10
  source: inferred
  clay_source:
    type: custom_company
    name: EU expansion
    custom_prompt: Has this company opened an EU office, entity or EU-specific product in the last 6 months? Return yes/no,
      country, date and source URL.
  threshold: yes, dated within 6 months
  external_source: null
  backtest:
    verdict: not_backtested
  personas:
  - Director of Product Security
  - General Counsel
  play_ref: play_cra
- id: appsec_hiring
  name: Open AppSec, DevSecOps or Product Security role posted in the last 45 days
  category: hiring_org_design
  trigger_ref: T1
  buying_stage: consideration
  decay_window_days: 45
  weight: 25
  source: clay
  clay_source:
    type: search_filter
    name: jobs.exists
    custom_prompt: null
  threshold: '>= 1 open role similar to Application Security / DevSecOps / Product Security Engineer, posted in trailing 45
    days'
  external_source: null
  backtest:
    verdict: not_backtested
  personas:
  - Head of Application Security
  - Director of Product Security
  play_ref: play_appsec_hire
- id: first_security_hire
  name: First-ever security engineer at a 150-500 person software company
  category: hiring_org_design
  trigger_ref: T1
  buying_stage: consideration
  decay_window_days: 60
  weight: 20
  source: inferred
  clay_source:
    type: search_filter
    name: jobs.exists + people.count
    custom_prompt: null
  threshold: Open security engineering role AND no current employee with a security title
  external_source: null
  backtest:
    verdict: not_backtested
  personas:
  - CTO
  - VP Engineering
  play_ref: play_appsec_hire
- id: platform_team_formation
  name: Platform engineering or developer experience team being formed
  category: hiring_org_design
  trigger_ref: T7
  buying_stage: awareness
  decay_window_days: 90
  weight: 10
  source: inferred
  clay_source:
    type: search_filter
    name: jobs.exists
    custom_prompt: null
  threshold: '>= 2 open roles titled Platform Engineer or Developer Experience Engineer'
  external_source: null
  backtest:
    verdict: not_backtested
  personas:
  - Head of Platform Engineering
  play_ref: null
- id: ai_coding_rollout
  name: Org-wide rollout of AI coding assistants (Copilot, Cursor, Claude Code)
  category: technographic
  trigger_ref: T2
  buying_stage: consideration
  decay_window_days: 120
  weight: 30
  source: inferred
  clay_source:
    type: custom_company
    name: AI coding assistant rollout
    custom_prompt: Has this company publicly announced or described an org-wide rollout of AI coding assistants (GitHub Copilot,
      Cursor, Claude Code or similar) in the last 12 months? Return yes/no, the tool, the date, and a source URL.
  threshold: yes, dated within 12 months
  external_source: null
  backtest:
    verdict: not_backtested
  personas:
  - VP Engineering
  - Head of Application Security
  play_ref: play_ai_code_surge
- id: cloud_native_shift
  name: Kubernetes, container or Terraform build-out
  category: technographic
  trigger_ref: T7
  buying_stage: awareness
  decay_window_days: 150
  weight: 10
