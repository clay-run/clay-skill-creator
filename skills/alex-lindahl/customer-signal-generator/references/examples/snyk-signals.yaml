  trigger_ref: T3
  buying_stage: decision
  decay_window_days: 180
  weight: 20
  source: inferred
  clay_source:
    type: search_filter
    name: jobs.exists(job_description contains)
    custom_prompt: null
  threshold: '>= 1 open role mentioning Checkmarx or Veracode'
  external_source: null
  backtest:
    verdict: not_backtested
  personas:
