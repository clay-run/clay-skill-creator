  category: technographic
  trigger_ref: T8
  buying_stage: decision
  decay_window_days: 180
  weight: 15
  source: inferred
  clay_source:
    type: search_filter
    name: technographics / jobs.exists
    custom_prompt: null
  threshold: Job descriptions or tech stack mention GitHub Advanced Security, CodeQL or Wiz Code
  external_source: null
  backtest:
    verdict: not_backtested
  personas:
  - CISO
  - Head of Application Security
  play_ref: play_bundle_defense
- id: new_security_leader
  name: New CISO, Head of AppSec or Head of Product Security in the last 120 days
  category: people_movement
  trigger_ref: T1
  buying_stage: awareness
  decay_window_days: 90
  weight: 20
