  clay_source:
    type: search_filter
    name: people.exists(start_date)
    custom_prompt: null
  threshold: Current role started within 120 days
  external_source: null
  backtest:
    verdict: not_backtested
  personas:
  - CISO
  - Head of Application Security
  play_ref: play_new_leader
- id: snyk_champion_moved
  name: Former Snyk user joins a non-customer in a security or platform role
  category: people_movement
  trigger_ref: T1
  buying_stage: consideration
  decay_window_days: 120
  weight: 30
  source: inferred
  clay_source:
    type: search_filter
    name: people.exists(description contains Snyk)
    custom_prompt: null
  threshold: Profile or past role mentions Snyk; started current role within 120 days; employer not a known customer
  external_source: Snyk CRM (to confirm the person was a real user)
  backtest:
    verdict: not_backtested
  personas:
  - Head of Application Security
  - Staff Security Engineer
  play_ref: play_champion
- id: eu_cra_exposure
  name: EU Cyber Resilience Act work (SBOM, PSIRT, vulnerability reporting)
  category: initiatives_programs
  trigger_ref: T4
  buying_stage: consideration
